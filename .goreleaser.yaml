# GoReleaser configuration -- https://goreleaser.com
#
# Produces cross-platform binaries, archives, SHA256 checksums, SBOMs, and a
# multi-arch container image. The image is built FROM the same prebuilt
# binaries that are attached to the GitHub Release, so consumers get bit-for-bit
# identical artifacts whether they download a binary or pull the image.
#
# Signing is keyless via cosign (Sigstore OIDC) -- no long-lived keys/secrets.
version: 2

project_name: event-reactor

builds:
  - id: er
    main: ./cmd/er
    binary: er
    env:
      # CGO must be disabled for static, cross-compiled, reproducible binaries.
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X github.com/oakwood-commons/event-reactor/pkg/params/version.Commit={{ .Commit }}
      - -X github.com/oakwood-commons/event-reactor/pkg/params/version.BuildVersion={{ .Version }}
      - -X github.com/oakwood-commons/event-reactor/pkg/params/version.BuildTime={{ .Date }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: er
    ids:
      - er
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
    format_overrides:
      - goos: windows
        formats: ["zip"]

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

# Software Bill of Materials (syft) for every archive, attached to the release.
sboms:
  - artifacts: archive

# Keyless cosign signature over the checksum file. Verifiers can validate every
# released artifact transitively through the signed checksums.
signs:
  - cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    output: true
    args:
      - "sign-blob"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

# Multi-arch container image built from the prebuilt binaries above.
dockers:
  - id: er-amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/oakwood-commons/event-reactor:{{ .Version }}-amd64"
      - "ghcr.io/oakwood-commons/event-reactor:{{ .Major }}.{{ .Minor }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Event-driven automation engine"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/oakwood-commons/event-reactor"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"
  - id: er-arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/oakwood-commons/event-reactor:{{ .Version }}-arm64"
      - "ghcr.io/oakwood-commons/event-reactor:{{ .Major }}.{{ .Minor }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.description=Event-driven automation engine"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.source=https://github.com/oakwood-commons/event-reactor"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

docker_manifests:
  - name_template: "ghcr.io/oakwood-commons/event-reactor:{{ .Version }}"
    image_templates:
      - "ghcr.io/oakwood-commons/event-reactor:{{ .Version }}-amd64"
      - "ghcr.io/oakwood-commons/event-reactor:{{ .Version }}-arm64"
  - name_template: "ghcr.io/oakwood-commons/event-reactor:{{ .Major }}.{{ .Minor }}"
    image_templates:
      - "ghcr.io/oakwood-commons/event-reactor:{{ .Major }}.{{ .Minor }}-amd64"
      - "ghcr.io/oakwood-commons/event-reactor:{{ .Major }}.{{ .Minor }}-arm64"
  - name_template: "ghcr.io/oakwood-commons/event-reactor:latest"
    # Do not move `latest` onto a prerelease (e.g. -rc) tag.
    skip_push: auto
    image_templates:
      - "ghcr.io/oakwood-commons/event-reactor:{{ .Version }}-amd64"
      - "ghcr.io/oakwood-commons/event-reactor:{{ .Version }}-arm64"

# Keyless cosign signature over the published image manifests (by digest).
docker_signs:
  - cmd: cosign
    artifacts: manifests
    output: true
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"

release:
  draft: false
  prerelease: auto

changelog:
  disable: false
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^chore:'
      - '^test:'
      - '^ci:'
